<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px 10px;background:#f5f3ef;font-family:Arial,Helvetica,sans-serif;color:#26364a">
    <div style="max-width:640px;margin:0 auto;background:#fff;border:1px solid #e9e4dc;border-radius:12px;overflow:hidden">
      <div style="padding:18px 28px;background:#d7cfca;text-align:center">
        <img src="cid:kalashwet-logo" width="185" alt="Kalashwet" style="display:block;width:185px;max-width:70%;height:auto;margin:0 auto;border:0">
      </div>
      <div style="height:4px;background:#c7a968"></div>
      <div style="padding:28px 30px">
        {% block content %}{% endblock %}
      </div>
      <div style="padding:18px 30px;background:#17324f;color:#e7edf4;font-size:12px;line-height:1.7">
        Thank you for choosing Kalashwet.<br>
        For help with your order, reply to this email or contact our support team.
      </div>
    </div>
  </body>
</html>
